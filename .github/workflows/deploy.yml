name: Deploy

# Runs automatically after CI (ci.yml) passes on main — no manual steps needed.
# Order: staging deploy -> staging smoke test -> production deploy -> production
# smoke test. If the production smoke test fails, the previous version is
# auto-rolled-back so a broken deploy never stays live unattended.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 7dcd021a0f64e56889505c60c878f3ab

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: D1 migrations — staging
        run: pnpm db:migrate:staging

      - name: Deploy — staging
        run: pnpm deploy:staging

      - name: Smoke test — staging
        run: pnpm smoke https://pokector-staging.huy-kenny.workers.dev
        env:
          # GitHub-hosted ubuntu-latest runners ship Chromium at this exact
          # path (same as the Raspberry Pi), so no separate browser install
          # step is needed. See scripts/smoke-live.mjs for the fallback.
          CHROME_PATH: /usr/bin/chromium

      - name: D1 migrations — production
        run: pnpm db:migrate:production

      - name: Deploy — production
        run: pnpm deploy:production

      - name: Smoke test — production
        id: smoke-production
        run: pnpm smoke https://pokector.com
        env:
          CHROME_PATH: /usr/bin/chromium

      - name: Auto-rollback production on failed smoke test
        if: failure() && steps.smoke-production.outcome == 'failure'
        run: |
          npx wrangler rollback --env production -y \
            -m "auto-rollback: post-deploy smoke test failed for ${{ github.sha }}"
