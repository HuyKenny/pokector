<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pokector">
  <!-- Original Pokector mark: a 3×3 binder-pocket grid with one highlighted card
       slot. Geometric shapes only; no third-party or franchise imagery. -->
